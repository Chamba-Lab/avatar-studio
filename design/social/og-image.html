<!doctype html>
<!--
  Source of public/og-image.png (1200 × 630, the link preview) and the home screen icons.
  Render with Playwright at the size of each #id; see design/social/README.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Instrument';
        src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 400 700;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: #0c0b0f;
        font-family: 'Instrument', sans-serif;
        color: #f6f1ea;
      }

      /* Link preview */
      #og {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #121016;
        background-image: radial-gradient(rgb(255 255 255 / 0.05) 1.5px, transparent 1.5px);
        background-size: 22px 22px;
        display: flex;
        align-items: center;
        padding: 0 0 0 84px;
      }
      #og .glow {
        position: absolute;
        right: 120px;
        top: 50%;
        width: 560px;
        height: 560px;
        translate: 0 -50%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(247 182 150 / 0.16), transparent);
      }
      #og .copy {
        position: relative;
        width: 540px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'Bricolage';
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 46px;
        height: 46px;
      }
      h1 {
        margin-top: 38px;
        font-family: 'Bricolage';
        font-weight: 800;
        font-size: 88px;
        line-height: 0.95;
        letter-spacing: -0.035em;
      }
      h1 span {
        color: #f7b696;
      }
      .sub {
        margin-top: 26px;
        font-size: 27px;
        line-height: 1.4;
        color: #a59fb0;
        max-width: 23ch;
      }
      .by {
        margin-top: 34px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        color: #a59fb0;
      }
      .by b {
        color: #7ce0c3;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #7ce0c3;
      }

      .stage {
        position: absolute;
        right: 56px;
        top: 0;
        bottom: 0;
        width: 500px;
      }
      .card {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 34px;
        border: 1px solid rgb(255 255 255 / 0.08);
        background: #1c1922;
        box-shadow: 0 30px 60px rgb(0 0 0 / 0.5);
      }
      .card.front {
        background: #25212c;
      }
      .av {
        position: relative;
      }
      .av .photo {
        position: absolute;
        inset: 6%;
        width: 88%;
        height: 88%;
        border-radius: 50%;
      }
      .av .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Home screen icon: drawn edge to edge so the OS can mask it (maskable). */
      .icon {
        width: 512px;
        height: 512px;
        background: #121016;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 340px;
        height: 340px;
      }
    </style>
  </head>
  <body>
    <section id="og">
      <div class="glow"></div>
      <div class="copy">
        <div class="brand"><img src="../../public/favicon.svg" alt="" />Avatar Studio</div>
        <h1>Dress up<br />your <span>avatar.</span></h1>
        <p class="sub">
          Frames and stickers for your Discord profile. Your photo never leaves your device.
        </p>
        <div class="by">
          <span class="dot"></span><b>by Chamba Lab</b><span>·&nbsp; free, no sign-up</span>
        </div>
      </div>
      <div class="stage">
        <div class="card" style="left: 0; top: 150px; width: 200px; height: 245px; rotate: -12deg">
          <div class="av" style="width: 150px; height: 150px">
            <img class="photo" src="../../src/assets/showcase/rakim-christmas.webp" alt="" />
            <img class="frame" src="../../src/themes/christmas/frames/wreath.webp" alt="" />
          </div>
        </div>
        <div class="card" style="right: 0; top: 130px; width: 200px; height: 245px; rotate: 11deg">
          <div class="av" style="width: 150px; height: 150px">
            <img class="photo" src="../../src/assets/showcase/rakim.webp" alt="" />
            <img class="frame" src="../../src/themes/new-year/frames/confetti-ring.svg" alt="" />
          </div>
        </div>
        <div
          class="card front"
          style="left: 125px; top: 110px; width: 270px; height: 340px; rotate: -2deg"
        >
          <div class="av" style="width: 220px; height: 220px">
            <img class="photo" src="../../src/assets/showcase/rakim.webp" alt="" />
            <img class="frame" src="../../src/themes/chamba-lab/frames/lab-ring.svg" alt="" />
          </div>
        </div>
      </div>
    </section>

    <section class="icon" id="icon">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect
          x="2"
          y="2"
          width="28"
          height="28"
          rx="9"
          fill="#F7B696"
          transform="rotate(-8 16 16)"
        />
        <circle cx="16" cy="16" r="8" fill="none" stroke="#1B0B02" stroke-width="3" />
        <path
          d="M23 4c.4 2.3 1.4 3.3 3.7 3.7-2.3.4-3.3 1.4-3.7 3.7-.4-2.3-1.4-3.3-3.7-3.7C21.6 7.3 22.6 6.3 23 4z"
          fill="#1B0B02"
        />
      </svg>
    </section>
  </body>
</html>
